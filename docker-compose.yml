# Локальна PostgreSQL 16 для розробки і тестів: pnpm db:up
# Запускає людина поза пісочницею агента (правила розд. 7 забороняють агентові docker).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: roombook
      POSTGRES_PASSWORD: roombook   # не секрет: лише локальна база з сід-даними
      POSTGRES_DB: roombook
    ports:
      - "5432:5432"
    volumes:
      - roombook-pg:/var/lib/postgresql/data
      - ./tools/dev/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roombook"]
      interval: 5s
      retries: 12

volumes:
  roombook-pg:
